[project]
name = "shadow-dungeon"
version = "0.2.0"
description = "暗影地牢：基于 agentscope ReActAgent 的 AI 自主闯关游戏（自主规划 · 自主打怪 · 自主挑战领主）"
readme = "README.md"
authors = [
    { name = "langjunnan" },
]
requires-python = ">=3.12"
dependencies = [
    "agentscope==1.0.16",
    "greenlet>=3.5.6",
    "loguru>=0.7.3",
    "mcp==1.13.1",
    "pydantic==2.12.5",
    "tqdm>=4.70.1",
]

[project.scripts]
shadow-dungeon = "shadow_dungeon.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
